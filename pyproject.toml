[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youcli"
version = "0.1.0"
description = "AI-powered Bash and Zsh terminal completion"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "httpx>=0.27,<1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
ai-complete = "ai_complete.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
